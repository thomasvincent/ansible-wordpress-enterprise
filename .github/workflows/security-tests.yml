---
name: Security Tests

on:
  # Pull requests and pushes run these assertions through the main CI
  # Molecule verifier. Keep this workflow for an independent daily audit and
  # explicit operator runs so self-hosted jobs cannot collide on container names.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security-hardening-tests:
    name: Security Hardening Tests
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      # Security assertions live in molecule/default/verify.yml and inspect the
      # exact hosts configured by the role. This replaces the old detached
      # shell harness, whose assertions often targeted a recreated container.
      - name: Run catalogued security contract
        run: molecule test --scenario-name default
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  security-compliance-check:
    name: Security Compliance Check
    runs-on: [self-hosted, linux, x64]
    needs: security-hardening-tests
    timeout-minutes: 5

    steps:
      - name: Record verified security baseline
        run: |
          {
            echo "## Security baseline"
            echo ""
            echo "Molecule converge, idempotence, runtime, database, HTTP, file-permission,"
            echo "and uploads assertions passed on Ubuntu 24/Nginx and Rocky 9/Apache."
          } >> "$GITHUB_STEP_SUMMARY"
